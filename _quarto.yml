project:
  type: website
  output-dir: docs

website:
  title: "Josh Persi"
  site-url: https://joshpersi.github.io/blog/
  description: "Josh Persi's data science blog"
  search: false
  cookie-consent:
    type: implied
    style: simple
  google-analytics: 
    tracking-id: G-L48M6M6N6G
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/joshpersi
      - icon: bluesky
        href: https://bsky.app/profile/joshpersi.bsky.social
      - icon: linkedin
        href: https://www.linkedin.com/in/josh-persi
  
code-annotations: hover

format: 
  html:
    engine: knitr
    highlight-style: nord
    theme: 
      light: style.scss
      dark: style-dark.scss
    code-link: true
    code-overflow: scroll
    respect-user-color-scheme: true

editor: source
